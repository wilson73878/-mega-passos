<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mega Passos V9</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#07111f;
  color:#f4f7fb;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}
.container{
  max-width:900px;
  margin:auto;
  padding:24px 18px 80px;
}
h1{font-size:34px;margin-bottom:8px}
h2{font-size:27px;margin-top:0}
.sub{color:#aab6c9;line-height:1.5}
.card{
  background:#152136;
  border-radius:24px;
  padding:24px;
  margin-top:22px;
  overflow:auto;
}
textarea{
  width:100%;
  height:270px;
  background:#0b1628;
  color:white;
  border:2px solid #43516b;
  border-radius:18px;
  padding:16px;
  font-size:16px;
}
button{
  width:100%;
  margin-top:18px;
  padding:20px;
  border:0;
  border-radius:20px;
  background:#86d292;
  color:#1264ef;
  font-weight:800;
  font-size:22px;
}
.grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:14px;
}
.ball{
  aspect-ratio:1;
  background:#86d292;
  color:#07111f;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:27px;
  font-weight:800;
}
.metric{
  font-size:31px;
  color:#86d292;
  font-weight:800;
}
.good{color:#86d292;font-weight:800}
.bad{color:#ff8989;font-weight:800}
.warn{color:#ffd06c;font-weight:800}

table{
  width:100%;
  border-collapse:collapse;
  min-width:600px;
}
th,td{
  padding:12px 8px;
  border-bottom:1px solid #43516b;
  text-align:center;
}
th{color:#9bd5a3}
.small{font-size:14px;color:#aab6c9}
</style>
</head>

<body>
<div class="container">

<h1>MEGA PASSOS V9</h1>
<p class="sub">
Validação temporal com seleção interna de modelo.
O concurso seguinte aos dados informados permanece totalmente fora do treinamento.
</p>

<div class="card">
<h2>Histórico</h2>
<p class="sub">
Cole os concursos até o último resultado permitido para desenvolvimento.
Para nosso teste atual, use somente até o concurso <b>3066</b>.
</p>

<textarea id="dados" placeholder="3066 04 06 09 13 28 48
3065 08 10 30 38 50 53
..."></textarea>

<button onclick="executar()">EXECUTAR V9</button>
</div>

<div id="saida"></div>

</div>

<script>

function parseDados(txt){
  const linhas=txt.trim().split(/\n+/);
  let arr=[];

  for(const l of linhas){
    const n=l.trim().split(/\s+/).map(Number);

    if(n.length<7) continue;

    const concurso=n[0];
    const dezenas=n.slice(1,7);

    if(!Number.isInteger(concurso)) continue;
    if(new Set(dezenas).size!==6) continue;
    if(dezenas.some(x=>x<1||x>60)) continue;

    arr.push({concurso,dezenas});
  }

  arr.sort((a,b)=>a.concurso-b.concurso);

  return arr;
}

function passoAtual(hist,d){
  for(let i=hist.length-1;i>=0;i--){
    if(hist[i].dezenas.includes(d))
      return hist.length-i;
  }
  return hist.length+1;
}

function freq(hist,d,n){
  const h=hist.slice(-n);
  if(!h.length) return 0;

  let c=0;
  for(const x of h)
    if(x.dezenas.includes(d)) c++;

  return c/h.length;
}

function gaps(hist,d){
  let pos=[];

  hist.forEach((x,i)=>{
    if(x.dezenas.includes(d)) pos.push(i);
  });

  let g=[];
  for(let i=1;i<pos.length;i++)
    g.push(pos[i]-pos[i-1]);

  return g;
}

function media(a){
  if(!a.length) return 0;
  return a.reduce((s,x)=>s+x,0)/a.length;
}

function desvio(a){
  if(a.length<2) return 0;

  const m=media(a);
  return Math.sqrt(
    a.reduce((s,x)=>s+(x-m)*(x-m),0)/a.length
  );
}

function hazard(hist,d){
  const p=passoAtual(hist,d);
  const gs=gaps(hist,d);

  if(!gs.length) return .10;

  let chegou=0;
  let saiu=0;

  for(const g of gs){
    if(g>=p) chegou++;
    if(g===p) saiu++;
  }

  // suavização beta
  return (saiu+1)/(chegou+10);
}

function faixa(p){
  if(p<=3) return 0;
  if(p<=6) return 1;
  if(p<=10) return 2;
  if(p<=15) return 3;
  return 4;
}

function aprenderRegimes(hist){

  let n=[0,0,0,0,0];
  let ac=[0,0,0,0,0];

  const inicio=Math.max(30,0);

  for(let t=inicio;t<hist.length;t++){

    const passado=hist.slice(0,t);
    const real=new Set(hist[t].dezenas);

    for(let d=1;d<=60;d++){

      const f=faixa(passoAtual(passado,d));

      n[f]++;

      if(real.has(d))
        ac[f]++;
    }
  }

  return n.map((x,i)=>{
    const taxa=(ac[i]+2)/(x+20);

    return {
      n:x,
      ac:ac[i],
      taxa,
      lift:taxa/.10
    };
  });
}

function scoreModelo(hist,d,modelo,regimes){

  const p=passoAtual(hist,d);
  const hz=hazard(hist,d);

  const f25=freq(hist,d,25);
  const f50=freq(hist,d,50);
  const f100=freq(hist,d,100);

  const gs=gaps(hist,d);
  const mg=media(gs);
  const sd=desvio(gs);

  const regime=regimes[faixa(p)].lift;

  const z=sd>0 ? Math.abs(p-mg)/sd : 0;

  switch(modelo){

    case 0:
      return hz;

    case 1:
      return regime;

    case 2:
      return hz*.65 + regime*.35;

    case 3:
      return hz*.50 + regime*.30 + f25*.20;

    case 4:
      return hz*.40 + regime*.30 + f50*.20 + f25*.10;

    case 5:
      return hz*.35 + regime*.25 +
             f25*.15 + f50*.15 + f100*.10;

    case 6:
      return hz*.45 + regime*.35 +
             (1/(1+z))*.20;

    case 7:
      return regime*.45 +
             f25*.20 +
             f50*.20 +
             hz*.15;
  }
}

function ranking(hist,modelo){

  const regimes=aprenderRegimes(hist);

  let r=[];

  for(let d=1;d<=60;d++){
    r.push({
      d,
      score:scoreModelo(hist,d,modelo,regimes),
      passo:passoAtual(hist,d),
      hazard:hazard(hist,d),
      regime:regimes[faixa(passoAtual(hist,d))].lift
    });
  }

  r.sort((a,b)=>
    b.score-a.score || a.d-b.d
  );

  return r;
}

function testarModelo(hist,modelo,inicio,fim){

  let total=0;
  let testes=0;

  for(let t=inicio;t<fim;t++){

    const passado=hist.slice(0,t);

    if(passado.length<35) continue;

    const top=ranking(passado,modelo)
      .slice(0,10)
      .map(x=>x.d);

    const real=new Set(hist[t].dezenas);

    total+=top.filter(x=>real.has(x)).length;
    testes++;
  }

  return {
    media:testes ? total/testes : 0,
    testes
  };
}

function escolherModelo(hist,fimTreino){

  const inicio=Math.max(35,fimTreino-50);

  let candidatos=[];

  for(let m=0;m<8;m++){

    const r=testarModelo(hist,m,inicio,fimTreino);

    candidatos.push({
      modelo:m,
      media:r.media,
      testes:r.testes
    });
  }

  candidatos.sort((a,b)=>
    b.media-a.media || a.modelo-b.modelo
  );

  return candidatos;
}

function fmt(x,n=3){
  return Number(x).toFixed(n);
}

function executar(){

  const hist=parseDados(
    document.getElementById("dados").value
  );

  if(hist.length<70){
    alert("Use pelo menos 70 concursos válidos.");
    return;
  }

  /*
    BLOCO FINAL:
    últimos 25 concursos disponíveis são validação.
    Nenhum deles participa da seleção inicial do modelo.
  */

  const corte=hist.length-25;

  const treino=hist.slice(0,corte);
  const validacao=hist.slice(corte);

  const candidatos=escolherModelo(treino,treino.length);

  const vencedor=candidatos[0].modelo;

  /*
    validação completamente fora do treino
  */

  let dist=[0,0,0,0,0,0,0];
  let soma=0;
  let detalhes=[];

  for(let t=corte;t<hist.length;t++){

    const passado=hist.slice(0,t);

    /*
      Para cada ponto temporal, o modelo é escolhido
      usando apenas concursos anteriores ao teste.
    */

    const fimLocal=passado.length;

    const escolha=escolherModelo(
      passado,
      fimLocal
    );

    const modeloLocal=escolha[0].modelo;

    const top=ranking(
      passado,
      modeloLocal
    ).slice(0,10).map(x=>x.d);

    const real=new Set(hist[t].dezenas);

    const ac=top.filter(x=>real.has(x)).length;

    soma+=ac;
    dist[ac]++;

    detalhes.push({
      concurso:hist[t].concurso,
      acertos:ac,
      modelo:modeloLocal
    });
  }

  const mediaVal=soma/validacao.length;
  const lift=mediaVal/1.0;

  /*
    ranking final para concurso seguinte
    usa somente histórico fornecido.
  */

  const escolhaFinal=escolherModelo(
    hist,
    hist.length
  );

  const modeloFinal=escolhaFinal[0].modelo;

  const rankFinal=ranking(
    hist,
    modeloFinal
  );

  const top10=rankFinal.slice(0,10);

  const regimes=aprenderRegimes(hist);

  let html=`

  <div class="card">
    <h2>VALIDAÇÃO V9 CONCLUÍDA</h2>

    <p>
    ${hist.length} concursos reconhecidos.<br>
    Intervalo:
    <b>${hist[0].concurso}</b>
    até
    <b>${hist.at(-1).concurso}</b><br>

    Concurso alvo:
    <b>${hist.at(-1).concurso+1}</b>
    </p>

    <p class="sub">
    Seleção de modelo realizada somente com informações
    disponíveis antes de cada concurso testado.
    </p>
  </div>

  <div class="card">
    <h2>VALIDAÇÃO FORA DA AMOSTRA — TOP 10</h2>

    <div class="metric">
      ${fmt(mediaVal)} / 6
    </div>

    <p>
      Baseline aleatório: <b>1.000 / 6</b><br>
      Lift:
      <span class="${lift>1?'good':'bad'}">
      ${fmt(lift)}×
      </span>
    </p>
  </div>

  <div class="card">
    <h2>TOP 10 — V9</h2>

    <div class="grid">
  `;

  top10.forEach(x=>{
    html+=`
      <div class="ball">
      ${String(x.d).padStart(2,"0")}
      </div>
    `;
  });

  html+=`
    </div>

    <p class="sub">
    Modelo selecionado para o próximo concurso:
    <b>M${modeloFinal}</b>
    </p>
  </div>

  <div class="card">
    <h2>DISTRIBUIÇÃO — VALIDAÇÃO</h2>

    <table>
    <tr>
      <th>Acertos</th>
      <th>Concursos</th>
      <th>%</th>
    </tr>
  `;

  for(let i=0;i<=6;i++){
    html+=`
    <tr>
      <td>${i}/6</td>
      <td>${dist[i]}</td>
      <td>${fmt(dist[i]/validacao.length*100,1)}%</td>
    </tr>
    `;
  }

  html+=`
    </table>
  </div>

  <div class="card">
    <h2>MODELOS — SELEÇÃO FINAL</h2>

    <table>
    <tr>
      <th>Modelo</th>
      <th>Média interna</th>
      <th>Testes</th>
    </tr>
  `;

  escolhaFinal.forEach(x=>{
    html+=`
    <tr>
      <td>M${x.modelo}</td>
      <td>${fmt(x.media)}</td>
      <td>${x.testes}</td>
    </tr>
    `;
  });

  html+=`
    </table>
  </div>

  <div class="card">
    <h2>REGIMES DE PASSO</h2>

    <table>
    <tr>
      <th>Passo</th>
      <th>N</th>
      <th>Acertos</th>
      <th>Taxa ajust.</th>
      <th>Lift</th>
    </tr>
  `;

  const nomes=["1–3","4–6","7–10","11–15","16+"];

  regimes.forEach((r,i)=>{
    html+=`
    <tr>
      <td>${nomes[i]}</td>
      <td>${r.n}</td>
      <td>${r.ac}</td>
      <td>${fmt(r.taxa*100,1)}%</td>
      <td>${fmt(r.lift)}×</td>
    </tr>
    `;
  });

  html+=`
    </table>
  </div>

  <div class="card">
    <h2>25 TESTES FINAIS</h2>

    <table>
    <tr>
      <th>Concurso</th>
      <th>Modelo escolhido</th>
      <th>Acertos Top 10</th>
    </tr>
  `;

  detalhes.slice().reverse().forEach(x=>{
    html+=`
    <tr>
      <td>${x.concurso}</td>
      <td>M${x.modelo}</td>
      <td><b>${x.acertos}/6</b></td>
    </tr>
    `;
  });

  html+=`
    </table>
  </div>

  <div class="card">
    <h2>RANKING COMPLETO — 60 DEZENAS</h2>

    <table>
    <tr>
      <th>#</th>
      <th>Dez</th>
      <th>Passo</th>
      <th>Hazard</th>
      <th>Lift regime</th>
    </tr>
  `;

  rankFinal.forEach((x,i)=>{
    html+=`
    <tr>
      <td>${i+1}</td>
      <td><b>${String(x.d).padStart(2,"0")}</b></td>
      <td>${x.passo}</td>
      <td>${fmt(x.hazard*100,1)}%</td>
      <td>${fmt(x.regime)}×</td>
    </tr>
    `;
  });

  html+=`
    </table>
  </div>
  `;

  document.getElementById("saida").innerHTML=html;

  document.getElementById("saida")
    .scrollIntoView({behavior:"smooth"});
}

</script>
</body>
</html>
