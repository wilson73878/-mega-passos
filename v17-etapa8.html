<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Mega Passos V17 — Etapa 8</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#07111f;color:#f4f7fb;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif
}
.container{max-width:950px;margin:auto;padding:24px 18px 80px}
h1{font-size:34px;margin-bottom:8px}
h2{font-size:25px;margin-top:0}
.sub{color:#aab6c9;line-height:1.55}
.card{
 background:#152136;border-radius:24px;
 padding:24px;margin-top:22px;overflow:auto
}
textarea{
 width:100%;height:270px;background:#0b1628;color:white;
 border:2px solid #43516b;border-radius:18px;
 padding:16px;font-size:16px
}
button{
 width:100%;margin-top:18px;padding:20px;border:0;
 border-radius:20px;background:#86d292;color:#1264ef;
 font-weight:800;font-size:21px
}
button:disabled{opacity:.55}
table{
 width:100%;border-collapse:collapse;min-width:720px
}
th,td{
 padding:11px 8px;border-bottom:1px solid #43516b;
 text-align:center;white-space:nowrap
}
th{color:#9bd5a3}
.good{color:#86d292;font-weight:800}
.bad{color:#ff8989;font-weight:800}
.warn{color:#ffd06c;font-weight:800}
.metric{font-size:30px;font-weight:900}
.progress{
 height:17px;background:#26354b;
 border-radius:10px;overflow:hidden;margin-top:14px
}
.bar{height:100%;width:0;background:#86d292}
</style>
</head>

<body>
<div class="container">

<h1>MEGA PASSOS V17 — ETAPA 8</h1>

<p class="sub">
Auditoria estatística do M5 congelado.
Nenhuma nova variável será adicionada.
</p>

<div class="card">

<h2>Histórico</h2>

<p class="sub">
Use somente <b>2918 até 3066</b>.<br>
O concurso 3067 permanece fora.
</p>

<textarea id="dados"
placeholder="3066 04 06 09 13 28 48
3065 08 10 30 38 50 53
..."></textarea>

<button id="btn" onclick="iniciar()">
EXECUTAR V17 — AUDITORIA M5
</button>

</div>

<div id="status"></div>
<div id="saida"></div>

</div>

<script>

/* =============================
   PARSER
============================= */

function parseDados(txt){

 let arr=[];

 for(const l of txt.trim().split(/\n+/)){

   const n=l.trim().split(/\s+/).map(Number);

   if(n.length<7) continue;

   const concurso=n[0];
   const dezenas=n.slice(1,7);

   if(!Number.isInteger(concurso)) continue;
   if(new Set(dezenas).size!==6) continue;
   if(dezenas.some(x=>x<1||x>60)) continue;

   arr.push({concurso,dezenas});
 }

 arr.sort((a,b)=>a.concurso-b.concurso);

 return arr;
}

/* =============================
   M5 — CONGELADO
============================= */

function passoAtual(hist,d){

 for(let i=hist.length-1;i>=0;i--){

   if(hist[i].dezenas.includes(d))
     return hist.length-i;
 }

 return hist.length+1;
}

function freq(hist,d,n){

 const h=n>=hist.length ? hist : hist.slice(-n);

 if(!h.length) return 0;

 let c=0;

 for(const x of h)
   if(x.dezenas.includes(d))
     c++;

 return c/h.length;
}

function gaps(hist,d){

 let p=[];

 hist.forEach((x,i)=>{
   if(x.dezenas.includes(d))
     p.push(i);
 });

 let g=[];

 for(let i=1;i<p.length;i++)
   g.push(p[i]-p[i-1]);

 return g;
}

function hazard(hist,d){

 const p=passoAtual(hist,d);
 const gs=gaps(hist,d);

 if(!gs.length)
   return .10;

 let chegou=0;
 let saiu=0;

 for(const g of gs){

   if(g>=p) chegou++;
   if(g===p) saiu++;
 }

 return (saiu+1)/(chegou+10);
}

function faixa(p){

 if(p<=3) return 0;
 if(p<=6) return 1;
 if(p<=10) return 2;
 if(p<=15) return 3;

 return 4;
}

function aprenderRegimes(hist){

 let n=[0,0,0,0,0];
 let ac=[0,0,0,0,0];

 for(let t=30;t<hist.length;t++){

   const passado=hist.slice(0,t);
   const real=new Set(hist[t].dezenas);

   for(let d=1;d<=60;d++){

     const f=
       faixa(
         passoAtual(passado,d)
       );

     n[f]++;

     if(real.has(d))
       ac[f]++;
   }
 }

 return n.map((x,i)=>{

   const taxa=
     (ac[i]+2)/(x+20);

   return {
     n:x,
     ac:ac[i],
     taxa,
     lift:taxa/.10
   };
 });
}

function scoreM5(hist,d,regimes){

 const p=passoAtual(hist,d);
 const hz=hazard(hist,d);

 return (
   hz*.35 +
   regimes[faixa(p)].lift*.25 +
   freq(hist,d,25)*.15 +
   freq(hist,d,50)*.15 +
   freq(hist,d,100)*.10
 );
}

function rankingM5(hist){

 const regimes=
   aprenderRegimes(hist);

 let r=[];

 for(let d=1;d<=60;d++){

   r.push({
     d,
     score:
       scoreM5(
         hist,d,regimes
       )
   });
 }

 r.sort(
   (a,b)=>
   b.score-a.score ||
   a.d-b.d
 );

 return r;
}

function hits(rank,real,k){

 const top=
   new Set(
     rank.slice(0,k).map(x=>x.d)
   );

 let n=0;

 for(const d of real)
   if(top.has(d))
     n++;

 return n;
}

/* =============================
   COMBINATÓRIA
============================= */

function comb(n,k){

 if(k<0 || k>n)
   return 0;

 if(k===0 || k===n)
   return 1;

 k=Math.min(k,n-k);

 let r=1;

 for(let i=1;i<=k;i++){

   r=
     r*(n-k+i)/i;
 }

 return r;
}

/*
Distribuição hipergeométrica.

Top K seleciona K dezenas dentre 60.
O sorteio contém 6 dezenas.

P(X=x) =
C(K,x) C(60-K,6-x) / C(60,6)
*/

function probAleatoria(k,x){

 return (
   comb(k,x)*
   comb(60-k,6-x)
 )/
 comb(60,6);
}

/* =============================
   WALK-FORWARD M5
============================= */

function auditar(hist){

 const ks=[6,10,15,20,25,30,40];

 let soma={
   6:0,10:0,15:0,20:0,
   25:0,30:0,40:0
 };

 let dist=
   [0,0,0,0,0,0,0];

 let registros=[];

 for(let t=35;t<hist.length;t++){

   const passado=
     hist.slice(0,t);

   const rank=
     rankingM5(passado);

   const real=
     new Set(
       hist[t].dezenas
     );

   let h10=0;

   for(const k of ks){

     const h=
       hits(rank,real,k);

     soma[k]+=h;

     if(k===10)
       h10=h;
   }

   dist[h10]++;

   registros.push({
     concurso:hist[t].concurso,
     hits10:h10
   });
 }

 const n=registros.length;

 let medias={};

 for(const k of ks)
   medias[k]=soma[k]/n;

 return {
   n,
   soma,
   medias,
   dist,
   registros
 };
}

/* =============================
   ESTATÍSTICA TOP10
============================= */

function estatisticaTop10(r){

 const n=r.n;

 const media=
   r.medias[10];

 /*
 Para seleção aleatória de 10 números:
 X ~ Hipergeométrica
 N=60, K=10, n=6

 E[X] = 1
 */

 const baseline=1;

 const variancia=
   6*
   (10/60)*
   (1-10/60)*
   ((60-6)/(60-1));

 const dpSorteio=
   Math.sqrt(variancia);

 const erroPadrao=
   dpSorteio/
   Math.sqrt(n);

 const z=
   (media-baseline)/
   erroPadrao;

 const icInf=
   media-
   1.96*erroPadrao;

 const icSup=
   media+
   1.96*erroPadrao;

 return {
   baseline,
   variancia,
   dpSorteio,
   erroPadrao,
   z,
   icInf,
   icSup
 };
}

function fmt(x,n=3){
 return Number(x).toFixed(n);
}

function pct(x){
 return (x*100).toFixed(1)+"%";
}

function pausa(){
 return new Promise(r=>setTimeout(r,30));
}

/* =============================
   EXECUÇÃO
============================= */

async function iniciar(){

 const btn=
   document.getElementById("btn");

 btn.disabled=true;

 const hist=
   parseDados(
     document
       .getElementById("dados")
       .value
   );

 if(hist.length<100){

   alert(
     "Use pelo menos 100 concursos válidos."
   );

   btn.disabled=false;
   return;
 }

 document.getElementById("status").innerHTML=`

 <div class="card">

 <h2>PROCESSANDO AUDITORIA...</h2>

 <p class="sub">
 Recalculando cada concurso usando
 somente o histórico disponível antes
 dele.
 </p>

 <div class="progress">
 <div class="bar" id="bar"></div>
 </div>

 </div>
 `;

 document.getElementById("bar").style.width="30%";

 await pausa();

 const r=auditar(hist);

 document.getElementById("bar").style.width="80%";

 await pausa();

 const e=
   estatisticaTop10(r);

 document.getElementById("bar").style.width="100%";

 await pausa();

 mostrar(hist,r,e);

 btn.disabled=false;
}

/* =============================
   RESULTADOS
============================= */

function mostrar(hist,r,e){

 const ks=
   [6,10,15,20,25,30,40];

 let html=`

 <div class="card">

 <h2>ETAPA 8 CONCLUÍDA</h2>

 <p>

 Histórico:
 <b>
 ${hist[0].concurso}–
 ${hist.at(-1).concurso}
 </b>
 <br>

 Walk-forward:
 <b>${r.n} concursos</b>

 </p>

 </div>

 <div class="card">

 <h2>M5 — TODOS OS CORTES</h2>

 <table>

 <tr>
 <th>Grupo</th>
 <th>M5</th>
 <th>Aleatório</th>
 <th>Δ</th>
 </tr>
 `;

 for(const k of ks){

   const m=r.medias[k];
   const base=k/10;
   const d=m-base;

   html+=`

   <tr>

   <td>Top ${k}</td>

   <td><b>${fmt(m)}</b></td>

   <td>${fmt(base)}</td>

   <td class="${
     d>.02 ?
     "good" :
     d<-.02 ?
     "bad" :
     "warn"
   }">

   ${d>=0?"+":""}${fmt(d)}

   </td>

   </tr>
   `;
 }

 html+=`
 </table>
 </div>

 <div class="card">

 <h2>AUDITORIA ESTATÍSTICA — TOP 10</h2>

 <table>

 <tr>
 <th>Métrica</th>
 <th>Resultado</th>
 </tr>

 <tr>
 <td>Média M5</td>
 <td><b>${fmt(r.medias[10])}</b></td>
 </tr>

 <tr>
 <td>Baseline aleatório</td>
 <td>${fmt(e.baseline)}</td>
 </tr>

 <tr>
 <td>Vantagem observada</td>
 <td>
 <b>
 ${r.medias[10]-1>=0?"+":""}
 ${fmt(r.medias[10]-1)}
 </b>
 </td>
 </tr>

 <tr>
 <td>Erro-padrão</td>
 <td>${fmt(e.erroPadrao,4)}</td>
 </tr>

 <tr>
 <td>Z-score</td>
 <td><b>${fmt(e.z,2)}</b></td>
 </tr>

 <tr>
 <td>IC 95% da média</td>
 <td>
 ${fmt(e.icInf)} –
 ${fmt(e.icSup)}
 </td>
 </tr>

 </table>

 </div>

 <div class="card">

 <h2>DISTRIBUIÇÃO TOP 10</h2>

 <table>

 <tr>
 <th>Acertos</th>
 <th>M5 observado</th>
 <th>M5 %</th>
 <th>Aleatório esperado</th>
 <th>Esperado em ${r.n}</th>
 </tr>
 `;

 for(let x=0;x<=6;x++){

   const p=
     probAleatoria(10,x);

   html+=`

   <tr>

   <td>
   ${x}/6
   </td>

   <td>
   ${r.dist[x]}
   </td>

   <td>
   ${pct(r.dist[x]/r.n)}
   </td>

   <td>
   ${pct(p)}
   </td>

   <td>
   ${fmt(p*r.n,1)}
   </td>

   </tr>
   `;
 }

 html+=`
 </table>
 </div>

 <div class="card">

 <h2>INTERPRETAÇÃO AUTOMÁTICA</h2>

 <div class="metric">

 ${
   e.icInf>1 ?
   "SINAL ACIMA DO BASELINE" :
   "EVIDÊNCIA AINDA INSUFICIENTE"
 }

 </div>

 <p class="sub">

 ${
   e.icInf>1
   ?
   `O intervalo de 95% ficou inteiramente
   acima da média aleatória de 1,000.
   Isso justifica ampliar a validação,
   mas não significa capacidade de
   prever sorteios futuros.`
   :
   `O intervalo de 95% ainda inclui
   a média aleatória de 1,000.
   Portanto, com esta amostra, não
   podemos distinguir com segurança
   o desempenho do M5 de uma flutuação
   compatível com o acaso.`
 }

 </p>

 </div>

 <div class="card">

 <h2>REGRA DA ETAPA 8</h2>

 <p class="sub">

 Nenhum parâmetro do M5 foi alterado.

 <br><br>

 M5 =
 35% Hazard +
 25% Regime +
 15% F25 +
 15% F50 +
 10% F100.

 <br><br>

 Esta etapa é exclusivamente de
 auditoria. O resultado não será usado
 para reajustar pesos retroativamente.

 <br><br>

 <b>O concurso 3067 continua fora
 do desenvolvimento.</b>

 </p>

 </div>
 `;

 document
   .getElementById("saida")
   .innerHTML=html;

 document
   .getElementById("saida")
   .scrollIntoView({
     behavior:"smooth"
   });
}

</script>
</body>
</html>
