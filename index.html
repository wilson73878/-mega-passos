<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mega Passos</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #07111f;
    color: white;
    margin: 0;
    padding: 18px;
}

.container {
    max-width: 900px;
    margin: auto;
}

h1 {
    color: #32d17d;
}

textarea {
    width: 100%;
    height: 280px;
    box-sizing: border-box;
    background: #111d2e;
    color: white;
    border: 1px solid #52627a;
    border-radius: 10px;
    padding: 12px;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 16px;
    margin-top: 15px;
    background: #32d17d;
    color: #04110a;
    border: none;
    border-radius: 10px;
    font-size: 17px;
    font-weight: bold;
}

#status {
    margin-top: 15px;
    background: #111d2e;
    padding: 12px;
    border-radius: 10px;
}

#resultado {
    margin-top: 20px;
}

.numero {
    display: inline-block;
    background: #32d17d;
    color: #04110a;
    padding: 10px;
    margin: 4px;
    border-radius: 50%;
    width: 30px;
    text-align: center;
    font-weight: bold;
}

table {
    width: 100%;
    margin-top: 20px;
    border-collapse: collapse;
}

th, td {
    padding: 8px;
    border-bottom: 1px solid #344258;
    text-align: center;
}
</style>
</head>

<body>

<div class="container">

<h1>MEGA PASSOS</h1>

<p>Analisador experimental de passos das dezenas da Mega-Sena</p>

<textarea id="historico"
placeholder="Cole assim:

3067 01 04 17 33 41 52
3066 04 06 09 13 28 48
3065 08 10 30 38 50 53"></textarea>

<button onclick="analisar()">ANALISAR HISTÓRICO</button>

<div id="status">
Aguardando dados...
</div>

<div id="resultado"></div>

</div>

<script>

function analisar() {

    const texto =
    document.getElementById("historico").value.trim();

    const status =
    document.getElementById("status");

    const resultado =
    document.getElementById("resultado");

    if (!texto) {
        status.innerHTML =
        "ERRO: cole o histórico antes de analisar.";
        return;
    }

    const linhas = texto.split(/\r?\n/);

    let concursos = [];

    for (let linha of linhas) {

        const numeros =
        linha.trim().split(/\s+/).map(Number);

        if (numeros.length < 7)
            continue;

        const concurso = numeros[0];

        const dezenas = numeros.slice(1,7);

        const valido =
        concurso > 0 &&
        dezenas.every(n => n >= 1 && n <= 60) &&
        new Set(dezenas).size === 6;

        if (valido) {

            concursos.push({
                concurso: concurso,
                dezenas: dezenas
            });

        }
    }

    if (concursos.length < 2) {

        status.innerHTML =
        "ERRO: não consegui reconhecer os concursos.";

        return;
    }

    concursos.sort(
        (a,b) => a.concurso - b.concurso
    );

    const primeiro =
    concursos[0].concurso;

    const ultimo =
    concursos[concursos.length-1].concurso;

    const alvo = ultimo + 1;

    let ranking = [];

    for (let dezena = 1;
         dezena <= 60;
         dezena++) {

        let aparicoes = [];

        concursos.forEach((c,i) => {

            if (c.dezenas.includes(dezena))
                aparicoes.push(i);

        });

        let passos = [];

        for (let i=1;
             i<aparicoes.length;
             i++) {

            passos.push(
                aparicoes[i] -
                aparicoes[i-1]
            );
        }

        let passoAtual =
        aparicoes.length
        ? concursos.length -
          aparicoes[aparicoes.length-1]
        : concursos.length;

        let media =
        passos.length
        ? passos.reduce(
            (a,b)=>a+b,0
          ) / passos.length
        : 0;

        let diferenca =
        media > 0
        ? Math.abs(passoAtual-media)
        : 999;

        let score =
        media > 0
        ? 100 /
          (1+diferenca)
        : 0;

        ranking.push({
            dezena,
            passoAtual,
            media,
            score
        });

    }

    ranking.sort(
        (a,b)=>b.score-a.score
    );

    const top10 =
    ranking.slice(0,10);

    status.innerHTML =
    "<b>ANÁLISE CONCLUÍDA</b><br>" +
    concursos.length +
    " concursos reconhecidos.<br>" +
    "Intervalo: " +
    primeiro + " até " + ultimo +
    "<br>Concurso alvo: " + alvo;

    let html =
    "<h2>TOP 10 — PRÓXIMO PASSO</h2>";

    top10.forEach(r => {

        html +=
        '<span class="numero">' +
        String(r.dezena)
        .padStart(2,"0") +
        '</span>';

    });

    html +=
    "<h2>Ranking das 60 dezenas</h2>";

    html +=
    "<table>" +
    "<tr>" +
    "<th>Rank</th>" +
    "<th>Dezena</th>" +
    "<th>Passo atual</th>" +
    "<th>Média</th>" +
    "<th>Score</th>" +
    "</tr>";

    ranking.forEach((r,i)=>{

        html +=
        "<tr>" +
        "<td>"+(i+1)+"</td>" +
        "<td><b>"+
        String(r.dezena)
        .padStart(2,"0")+
        "</b></td>" +
        "<td>"+r.passoAtual+"</td>" +
        "<td>"+r.media.toFixed(2)+"</td>" +
        "<td>"+r.score.toFixed(1)+"</td>" +
        "</tr>";

    });

    html += "</table>";

    resultado.innerHTML = html;

}

</script>

</body>
</html>
